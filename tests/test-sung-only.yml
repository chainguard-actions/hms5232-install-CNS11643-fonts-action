name: Test sung-only installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fontconfig
        run: sudo apt-get install -y fontconfig
      - name: Set up fake font data to avoid real download
        run: |
          # Create fake cns11643.zip so clear.sh can remove it
          touch "$GITHUB_WORKSPACE/cns11643.zip"
          # Create Open_Data/Fonts with fake font files so copy.sh finds them
          mkdir -p "$GITHUB_WORKSPACE/Open_Data/Fonts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fonts/TW-Kai-98_1.ttf" "$GITHUB_WORKSPACE/Open_Data/Fonts/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fonts/TW-Sung-98_1.ttf" "$GITHUB_WORKSPACE/Open_Data/Fonts/"
          echo "Setup complete"
          ls -la "$GITHUB_WORKSPACE/Open_Data/Fonts/"
      - id: action
        uses: .
        with:
          kai: 'false'
          sung: 'true'
          download-flag: '-nv'
      - name: Assert ~/.fonts directory exists
        run: |
          if [ ! -d "$HOME/.fonts" ]; then
            echo "FAIL: ~/.fonts directory does not exist"
            exit 1
          fi
          echo "PASS: ~/.fonts directory exists"
      - name: Assert kai fonts NOT installed
        run: |
          KAI_COUNT=$(ls "$HOME/.fonts"/TW-Kai-*.ttf 2>/dev/null | wc -l)
          echo "Kai font count: $KAI_COUNT"
          if [ "$KAI_COUNT" -ne 0 ]; then
            echo "FAIL: TW-Kai-*.ttf fonts found in ~/.fonts but kai=false"
            exit 1
          fi
          echo "PASS: no kai fonts installed as expected"
      - name: Assert sung fonts installed
        run: |
          SUNG_COUNT=$(ls "$HOME/.fonts"/TW-Sung-*.ttf 2>/dev/null | wc -l)
          echo "Sung font count: $SUNG_COUNT"
          if [ "$SUNG_COUNT" -eq 0 ]; then
            echo "FAIL: no TW-Sung-*.ttf fonts found in ~/.fonts"
            exit 1
          fi
          echo "PASS: $SUNG_COUNT sung font(s) installed"
