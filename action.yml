name: 'Install CNS11643 fonts'
description: 'Install CNS11643 fonts'
author: hms5232
branding:
  icon: type
  color: yellow
inputs:
  kai:
    description: 'Install 正楷體 or not'
    required: false
    default: 'true'
  sung:
    description: 'Install 正宋體 or not'
    required: false
    default: 'true'
  download-flag:
    description: 'Add flag(s) when use wget'
    required: false
    default: '-nv'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - run: "$GITHUB_ACTION_PATH/init.sh"
      shell: bash
    - env:
        DOWNLOAD_FLAG: ${{ inputs.download-flag }}
      run: |
        echo "::group::download and unzip"
        "$GITHUB_ACTION_PATH/download.sh" -f "$DOWNLOAD_FLAG" || echo "Download completed"
        echo "::endgroup::"
      shell: bash
    - run: "$GITHUB_ACTION_PATH/copy.sh kai"
      shell: bash
      if: ${{ inputs.kai == 'true' }}
    - run: "$GITHUB_ACTION_PATH/copy.sh sung"
      shell: bash
      if: ${{ inputs.sung == 'true' }}
    - run: |
        echo "::group::update fonts"
        "$GITHUB_ACTION_PATH/install.sh"
        echo "::endgroup::"
      shell: bash
    - run: "$GITHUB_ACTION_PATH/clear.sh"
      shell: bash
