name: 'Install CNS11643 fonts'
description: 'Install CNS11643 fonts'
author: hms5232
branding:
  icon: type
  color: yellow
inputs:
  kai:
    description: 'Install 正楷體 or not'
    required: false
    default: 'true'
  sung:
    description: 'Install 正宋體 or not'
    required: false
    default: 'true'
  download-flag:
    description: 'Add flag(s) when use wget'
    required: false
    default: '-nv'
  cache:
    description: '快取已經下載過的字型'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - env:
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/init.sh"
      shell: bash
    - name: Restore cached Kai fonts
      id: cache-restore-kai
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: Fonts_Kai.zip
        key: kai
      if: ${{ inputs.kai == 'true' && inputs.cache == 'true' }}
    - env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_FLAG: ${{ inputs.download-flag }}
      run: |
        echo "::group::download and unzip Kai"
        "$ACTION_PATH/download_kai.sh" -f "$DOWNLOAD_FLAG"
        echo "::endgroup::"
      shell: bash
      if: ${{ inputs.kai == 'true' }}
    - name: Save cached Kai fonts
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: Fonts_Kai.zip
        key: kai
      if: ${{ inputs.kai == 'true' && inputs.cache == 'true' && steps.cache-restore-kai.outputs.cache-hit != 'true' }}
    - name: Restore cached Sung fonts
      id: cache-restore-sung
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: Fonts_Sung.zip
        key: sung
      if: ${{ inputs.sung == 'true' && inputs.cache == 'true' }}
    - env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_FLAG: ${{ inputs.download-flag }}
      run: |
        echo "::group::download and unzip Sung"
        "$ACTION_PATH/download_sung.sh" -f "$DOWNLOAD_FLAG"
        echo "::endgroup::"
      shell: bash
      if: ${{ inputs.sung == 'true' }}
    - name: Save cached Sung fonts
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: Fonts_Sung.zip
        key: sung
      if: ${{ inputs.sung == 'true' && inputs.cache == 'true' && steps.cache-restore-sung.outputs.cache-hit != 'true' }}
    - env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "::group::update fonts"
        "$ACTION_PATH/install.sh"
        echo "::endgroup::"
      shell: bash
    - env:
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/clear.sh"
      shell: bash
